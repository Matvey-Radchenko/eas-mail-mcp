[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # ring still uses getrandom 0.2; rand 0.9 still uses 0.3.
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    # rusqlite/hashlink has not moved to the indexmap hashbrown line.
    { name = "hashbrown", version = "0.16.1" },
    # rmcp and its macro stack are transitioning to base64 0.23 and syn 3.
    { name = "base64", version = "0.22.1" },
    { name = "syn", version = "2.0.119" },
    # toml 0.9 and toml_edit 0.25 currently use adjacent parser generations.
    { name = "toml_datetime", version = "0.7.5" },
    { name = "winnow", version = "0.7.15" },
    # chrono-tz 0.10 uses phf 0.12; html2text's parser stack uses phf 0.13.
    { name = "phf", version = "0.12.1" },
    { name = "phf_shared", version = "0.12.1" },
    # rtoolbox 0.0.5 and keyring 3.6.3 require older, incompatible windows-sys
    # lines. Keep the exceptions pinned until their upstream requirements align.
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-sys", version = "=0.60.2" },
    # rtoolbox's windows-sys 0.59 uses this import-library generation; keyring's
    # windows-sys 0.60 uses windows-targets 0.53 and windows_x86_64_msvc 0.53.
    { name = "windows-targets", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },
    # rmcp 3.0.1 uses 9.1; Windows setup uses 10 for suspended-child cleanup
    # when job assignment or thread resumption fails. See ADR 0002.
    { name = "process-wrap", version = "=9.1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
